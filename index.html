<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CobroMex</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

/* LOGIN */
#login {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #2563eb;
}

/* DASHBOARD */
#app {
    display: none;
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}

.cardBox {
    background: #1e293b;
    padding: 15px;
    border-radius: 12px;
}

h2 {
    margin-top: 0;
}

.small {
    font-size: 12px;
    opacity: 0.7;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <div class="card">
        <h2>🔐 CobroMex</h2>
        <input id="user" placeholder="Usuario">
        <input id="pass" type="password" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
        <p class="small" id="msg"></p>
    </div>
</div>

<!-- APP -->
<div id="app">
    <h2>📊 Dashboard</h2>

    <div class="grid">
        <div class="cardBox">
            <h3>Crear Boleto</h3>
            <input id="nombre" placeholder="Nombre">
            <input id="asiento" placeholder="Asiento">
            <input id="precio" placeholder="Precio">
            <button onclick="crear()">Crear</button>
        </div>

        <div class="cardBox">
            <h3>Acciones</h3>
            <button onclick="listar()">Listar</button>
        </div>
    </div>

    <div id="lista"></div>
</div>

<script>
let token = "";

function login() {
    fetch("/api/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            user: document.getElementById("user").value,
            password: document.getElementById("pass").value
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.token) {
            token = data.token;
            document.getElementById("login").style.display = "none";
            document.getElementById("app").style.display = "block";
        } else {
            document.getElementById("msg").innerText = "Error de login";
        }
    });
}

function crear() {
    fetch("/api/crear", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "token": token
        },
        body: JSON.stringify({
            nombre: document.getElementById("nombre").value,
            asiento: parseInt(document.getElementById("asiento").value),
            precio: parseFloat(document.getElementById("precio").value)
        })
    }).then(() => listar());
}

function listar() {
    fetch("/api/boletos", {
        headers: {"token": token}
    })
    .then(r => r.json())
    .then(data => {
        let html = "";
        data.forEach(b => {
            html += `
            <div class="cardBox">
                <b>${b.nombre}</b><br>
                Asiento: ${b.asiento}<br>
                Precio: $${b.precio}<br>
                ${b.pagado ? "✔ Pagado" : "⏳ Pendiente"}
            </div>
            `;
        });
        document.getElementById("lista").innerHTML = html;
    });
}
</script>

</body>
</html>
