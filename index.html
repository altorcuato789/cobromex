<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CobroMex Stripe Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:-apple-system, BlinkMacSystemFont, sans-serif;
background:#0b1220;
color:white;
}

.cardBox{
background:#111827;
padding:15px;
border-radius:12px;
margin:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
}

button{
background:#3b82f6;
border:none;
padding:8px;
color:white;
border-radius:8px;
cursor:pointer;
}

.ticket{
background:#1f2937;
padding:10px;
margin:10px;
border-radius:10px;
}
</style>
</head>

<body>

<div id="app" style="padding:20px;">

<h2>📊 Stripe Dashboard Pro</h2>

<div class="grid">
<div class="cardBox">Ingresos: <h2 id="ingresos">$0</h2></div>
<div class="cardBox">Hoy: <h2 id="ingresos_hoy">$0</h2></div>
<div class="cardBox">Total: <h2 id="total">0</h2></div>
<div class="cardBox">Pagados: <h2 id="pagados">0</h2></div>
<div class="cardBox">Pendientes: <h2 id="pendientes">0</h2></div>
<div class="cardBox">Promedio: <h2 id="promedio">$0</h2></div>
</div>

<canvas id="chart"></canvas>

<h3>Crear boleto</h3>
<input id="nombre" placeholder="Nombre">
<input id="asiento" placeholder="Asiento">
<input id="precio" placeholder="Precio">
<button onclick="crear()">Crear</button>

<div id="lista"></div>

</div>

<script>
let token="";
let chart;

function login(){
fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:"admin",password:"1234"})})
.then(r=>r.json())
.then(d=>{token=d.token;listar();stats();grafica();});
}

function stats(){
fetch("/api/stats",{headers:{"token":token}})
.then(r=>r.json())
.then(d=>{
ingresos.innerText="$"+d.ingresos;
ingresos_hoy.innerText="$"+d.ingresos_hoy;
total.innerText=d.total_boletos;
pagados.innerText=d.pagados;
pendientes.innerText=d.pendientes;
promedio.innerText="$"+d.ticket_promedio;
});
}

function grafica(){
fetch("/api/grafica",{headers:{"token":token}})
.then(r=>r.json())
.then(d=>{
if(chart)chart.destroy();

chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:d.labels,
datasets:[{
data:d.data,
borderColor:"#3b82f6"
}]
}
});
});
}

function crear(){
fetch("/api/crear",{method:"POST",headers:{"Content-Type":"application/json","token":token},
body:JSON.stringify({nombre,asiento:parseInt(asiento.value),precio:parseFloat(precio.value)})})
.then(()=>{stats();listar();grafica();});
}

function listar(){
fetch("/api/boletos",{headers:{"token":token}})
.then(r=>r.json())
.then(d=>{
lista.innerHTML=d.map(b=>`
<div class="ticket">
${b.nombre} - $${b.precio}
</div>`).join("");
});
}

login();
</script>

</body>
</html>
