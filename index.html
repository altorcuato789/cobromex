<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CobroMex Startup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#070A12;
color:white;
}

.container{
max-width:1100px;
margin:auto;
padding:35px;
}

.header{
font-size:26px;
font-weight:600;
margin-bottom:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:12px;
}

.card{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
padding:15px;
border-radius:16px;
}

input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:10px;
border:none;
background:#111827;
color:white;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#3b82f6;
color:white;
cursor:pointer;
}

.ticket{
background:#111827;
padding:12px;
margin-top:10px;
border-radius:12px;
display:flex;
justify-content:space-between;
}

.badge{
padding:4px 10px;
border-radius:999px;
font-size:12px;
}

.ok{background:#16a34a33;color:#22c55e;}
.bad{background:#f59e0b33;color:#f59e0b;}
</style>
</head>

<body>

<div class="container">

<div class="header">📊 CobroMex Startup Dashboard</div>

<div class="grid">

<div class="card">Ingresos<h2 id="ingresos">$0</h2></div>
<div class="card">Total<h2 id="total">0</h2></div>
<div class="card">Devueltos<h2 id="devueltos">0</h2></div>

</div>

<br>

<div class="card">
<h3>Crear boleto</h3>
<input id="nombre" placeholder="Nombre">
<input id="asiento" placeholder="Asiento">
<input id="precio" placeholder="Precio">
<button onclick="crear()">Crear</button>
</div>

<div id="lista"></div>

</div>

<script>

let token="";

function login(){
fetch("/api/login",{method:"POST"})
.then(r=>r.json())
.then(d=>{
token=d.token;
load();
});
}

function load(){
stats();
listar();
}

function stats(){
fetch("/api/stats",{headers:{"token":token}})
.then(r=>r.json())
.then(d=>{
ingresos.innerText="$"+d.ingresos;
total.innerText=d.total;
devueltos.innerText=d.devueltos;
});
}

function crear(){
fetch("/api/crear",{
method:"POST",
headers:{
"Content-Type":"application/json",
"token":token
},
body:JSON.stringify({
nombre:nombre.value,
asiento:parseInt(asiento.value),
precio:parseFloat(precio.value)
})
}).then(()=>load());
}

function listar(){
fetch("/api/boletos",{headers:{"token":token}})
.then(r=>r.json())
.then(d=>{
lista.innerHTML=d.map(b=>`
<div class="ticket">
<div>
<b>${b.nombre}</b><br>
Asiento ${b.asiento} - $${b.precio}
</div>

<div class="badge ${b.estado=="devuelto"?"bad":"ok"}">
${b.estado}
</div>
</div>
`).join("");
});
}

login();

</script>

</body>
</html>
