<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CobroMex Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#070A12;
color:#fff;
}

.container{
max-width:1100px;
margin:auto;
padding:35px;
}

.header{
font-size:28px;
font-weight:600;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px;
}

.card{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
padding:15px;
border-radius:16px;
backdrop-filter: blur(10px);
}

input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:10px;
border:none;
background:#111827;
color:white;
}

button{
padding:8px 12px;
border:none;
border-radius:10px;
cursor:pointer;
margin:4px;
font-weight:500;
}

.primary{background:#3b82f6;color:white;}
.danger{background:#ef4444;color:white;}
.gray{background:#374151;color:white;}

.ticket{
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
padding:15px;
border-radius:14px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.small{
font-size:12px;
opacity:0.7;
}

.actions{
display:flex;
gap:5px;
flex-wrap:wrap;
}

.badge{
padding:4px 10px;
border-radius:999px;
font-size:12px;
background:#16a34a22;
color:#22c55e;
}
</style>

</head>

<body>

<div class="container">

<div class="header">📊 CobroMex Dashboard</div>

<div class="grid">
<div class="card">Total boletos <h2 id="total">0</h2></div>
<div class="card">Ingresos <h2 id="ingresos">$0</h2></div>
<div class="card">Última venta <h2 id="ultima">—</h2></div>
</div>

<div class="card">
<h3>Crear boleto</h3>
<input id="nombre" placeholder="Nombre">
<input id="asiento" placeholder="Asiento">
<input id="precio" placeholder="Precio">
<button class="primary" onclick="crear()">Crear boleto</button>
</div>

<div id="lista"></div>

</div>

<script>

let token="";

function login(){
fetch("/api/login",{method:"POST"})
.then(r=>r.json())
.then(d=>{
token=d.token;
listar();
});
}

function crear(){
fetch("/api/crear",{
method:"POST",
headers:{
"Content-Type":"application/json",
"token":token
},
body:JSON.stringify({
nombre:document.getElementById("nombre").value,
asiento:parseInt(document.getElementById("asiento").value),
precio:parseFloat(document.getElementById("precio").value)
})
}).then(()=>listar());
}

function eliminar(id){
fetch("/api/eliminar/"+id,{
method:"DELETE",
headers:{"token":token}
}).then(()=>listar());
}

function qr(id){
window.open("/api/qr/"+id,"_blank");
}

function pdf(id){
window.open("/api/pdf/"+id,"_blank");
}

function devolver(id){
fetch("/api/devolucion/"+id,{
method:"POST",
headers:{"token":token}
}).then(()=>listar());
}

function listar(){
fetch("/api/boletos",{headers:{"token":token}})
.then(r=>r.json())
.then(data=>{

document.getElementById("total").innerText=data.length;

let ingresos=data.reduce((a,b)=>a+b.precio,0);
document.getElementById("ingresos").innerText="$"+ingresos;

if(data.length>0){
document.getElementById("ultima").innerText=data[data.length-1].fecha;
}

lista.innerHTML=data.map(b=>`
<div class="ticket">
<div>
<b>${b.nombre}</b><br>
<span class="small">Asiento ${b.asiento}</span><br>
<span class="small">${b.fecha}</span>
</div>

<div class="actions">
<button class="gray" onclick="qr('${b.id}')">QR</button>
<button class="gray" onclick="pdf('${b.id}')">PDF</button>
<button class="danger" onclick="eliminar('${b.id}')">Eliminar</button>
<button class="primary" onclick="devolver('${b.id}')">Devolución</button>
</div>
</div>
`).join("");

});
}

login();

</script>

</body>
</html>
