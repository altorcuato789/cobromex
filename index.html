<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CobroMex</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#0b0f19;
color:#fff;
}

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

.title{
font-size:26px;
font-weight:600;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:16px;
padding:16px;
backdrop-filter: blur(10px);
}

h2{
margin:8px 0 0 0;
font-size:22px;
}

.section{
margin-top:25px;
}

input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:10px;
border:none;
background:#111827;
color:#fff;
outline:none;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#3b82f6;
color:white;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
}

.list{
margin-top:20px;
}

.ticket{
background:#111827;
border:1px solid rgba(255,255,255,0.06);
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

.small{
opacity:0.6;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<div class="title">🎟 CobroMex Dashboard</div>

<!-- STATS -->
<div class="grid">

<div class="card">
Ingresos
<h2 id="ingresos">$0</h2>
</div>

<div class="card">
Hoy
<h2 id="hoy">$0</h2>
</div>

<div class="card">
Total
<h2 id="total">0</h2>
</div>

<div class="card">
Pagados
<h2 id="pagados">0</h2>
</div>

</div>

<!-- FORM -->
<div class="section card">
<h3>Crear boleto</h3>

<input id="nombre" placeholder="Nombre">
<input id="asiento" placeholder="Asiento">
<input id="precio" placeholder="Precio">

<button onclick="crear()">Crear boleto</button>
</div>

<!-- LISTA -->
<div class="list" id="lista"></div>

</div>

<script>

let token="";

function login(){
fetch("/api/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({user:"admin",password:"1234"})
})
.then(r=>r.json())
.then(d=>{
token=d.token;
load();
});
}

function load(){
stats();
listar();
}

function stats(){
fetch("/api/stats",{headers:{"token":token}})
.then(r=>r.json())
.then(d=>{
document.getElementById("ingresos").innerText="$"+d.ingresos;
document.getElementById("hoy").innerText="$"+d.ingresos_hoy;
document.getElementById("total").innerText=d.total_boletos;
document.getElementById("pagados").innerText=d.pagados;
});
}

function crear(){
fetch("/api/crear",{
method:"POST",
headers:{
"Content-Type":"application/json",
"token":token
},
body:JSON.stringify({
nombre:document.getElementById("nombre").value,
asiento:parseInt(document.getElementById("asiento").value),
precio:parseFloat(document.getElementById("precio").value)
})
}).then(()=>load());
}

function listar(){
fetch("/api/boletos",{headers:{"token":token}})
.then(r=>r.json())
.then(data=>{
document.getElementById("lista").innerHTML=
data.map(b=>`
<div class="ticket">
<b>${b.nombre}</b><br>
Asiento: ${b.asiento}<br>
Precio: $${b.precio}<br>
Estado: ${b.pagado ? "✔ Pagado" : "⏳ Pendiente"}
</div>
`).join("");
});
}

login();

</script>

</body>
</html>
