<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CobroMex Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    background: #0b1220;
    color: white;
}

/* ANIMACIÓN SUAVE */
* {
    transition: all 0.2s ease;
}

/* LOGIN */
#login {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #1e293b, #0b1220);
}

.card {
    background: rgba(30,41,59,0.8);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 16px;
    width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
    outline: none;
    background: #0f172a;
    color: white;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #3b82f6;
    color: white;
    font-weight: bold;
}

button:hover {
    background: #2563eb;
    transform: scale(1.02);
}

/* DASHBOARD */
#app {
    display: none;
    padding: 25px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* CARDS */
.cardBox {
    background: rgba(30,41,59,0.8);
    backdrop-filter: blur(10px);
    padding: 18px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.small {
    font-size: 12px;
    opacity: 0.7;
}

/* BOLETOS */
.ticket {
    background: #111827;
    padding: 15px;
    border-radius: 12px;
    margin-top: 10px;
    border: 1px solid #1f2937;
}

.actions button {
    width: auto;
    margin: 5px 5px 0 0;
    padding: 8px 10px;
    font-size: 12px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <div class="card">
        <h2>🍏 CobroMex Pro</h2>
        <input id="user" placeholder="Usuario">
        <input id="pass" type="password" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
        <p class="small" id="msg"></p>
    </div>
</div>

<!-- APP -->
<div id="app">

    <div class="header">
        <h2>📊 Dashboard Ejecutivo</h2>
        <button onclick="listar()">🔄 Refresh</button>
    </div>

    <div class="grid">

        <div class="cardBox">
            <h3>Crear Boleto</h3>
            <input id="nombre" placeholder="Nombre">
            <input id="asiento" placeholder="Asiento">
            <input id="precio" placeholder="Precio">
            <button onclick="crear()">Crear boleto</button>
        </div>

        <div class="cardBox">
            <h3>Resumen</h3>
            <button onclick="listar()">Ver boletos</button>
        </div>

    </div>

    <div id="lista"></div>

</div>

<script>
let token = "";

function login() {
    fetch("/api/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            user: document.getElementById("user").value,
            password: document.getElementById("pass").value
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.token) {
            token = data.token;
            document.getElementById("login").style.display = "none";
            document.getElementById("app").style.display = "block";
            listar();
        } else {
            document.getElementById("msg").innerText = "Login incorrecto";
        }
    });
}

function crear() {
    fetch("/api/crear", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "token": token
        },
        body: JSON.stringify({
            nombre: document.getElementById("nombre").value,
            asiento: parseInt(document.getElementById("asiento").value),
            precio: parseFloat(document.getElementById("precio").value)
        })
    }).then(() => listar());
}

function eliminar(id) {
    fetch("/api/eliminar/" + id, {
        method: "DELETE",
        headers: {"token": token}
    }).then(() => listar());
}

function pagar(id) {
    fetch("/api/pagar/" + id, {
        method: "POST",
        headers: {"token": token}
    }).then(() => listar());
}

function listar() {
    fetch("/api/boletos", {
        headers: {"token": token}
    })
    .then(r => r.json())
    .then(data => {
        let html = "";

        data.forEach(b => {
            html += `
            <div class="ticket">
                <b>${b.nombre}</b><br>
                Asiento: ${b.asiento} <br>
                Precio: $${b.precio} <br>
                Fecha: ${b.fecha} <br>
                Estado: ${b.pagado ? "✔ Pagado" : "⏳ Pendiente"} <br>

                <div class="actions">
                    <button onclick="pagar('${b.id}')">Pagar</button>
                    <button onclick="eliminar('${b.id}')">Eliminar</button>
                    <a href="/api/qr/${b.id}" target="_blank"><button>QR</button></a>
                    <a href="/api/pdf/${b.id}" target="_blank"><button>PDF</button></a>
                </div>
            </div>
            `;
        });

        document.getElementById("lista").innerHTML = html;
    });
}
</script>

</body>
</html>
