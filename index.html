<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CobroMex</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
}

.container{
max-width:800px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:15px;
border-radius:12px;
margin-bottom:10px;
}

input{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:none;
background:#1f2937;
color:white;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#3b82f6;
color:white;
cursor:pointer;
}

.ticket{
background:#111827;
padding:10px;
margin-top:10px;
border-radius:10px;
}
</style>

</head>

<body>

<div class="container">

<h2>CobroMex</h2>

<div class="card">
<input id="nombre" placeholder="Nombre">
<input id="asiento" placeholder="Asiento">
<input id="precio" placeholder="Precio">
<button onclick="crear()">Crear boleto</button>
</div>

<div id="lista"></div>

</div>

<script>

function crear(){
fetch("/api/crear",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
nombre:nombre.value,
asiento:parseInt(asiento.value),
precio:parseFloat(precio.value)
})
}).then(()=>listar());
}

function listar(){
fetch("/api/boletos")
.then(r=>r.json())
.then(data=>{
lista.innerHTML=data.map(b=>`
<div class="ticket">
<b>${b.nombre}</b><br>
Asiento: ${b.asiento}<br>
$${b.precio}<br>
${b.fecha}
</div>
`).join("");
});
}

listar();

</script>

</body>
</html>
